name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"   # runs every day at midnight UTC
  workflow_dispatch:        # allows manual trigger from Actions tab
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: DharoonBalajii
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=c792ea&color_dots[0]=ebedf0&color_dots[1]=c792ea33&color_dots[2]=c792ea66&color_dots[3]=c792eaaa&color_dots[4]=c792ea
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=c792ea&color_dots[0]=161b22&color_dots[1]=2d1b69&color_dots[2]=4a2d8f&color_dots[3]=7c4dbd&color_dots[4]=c792ea

      - name: Push snake SVG to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
