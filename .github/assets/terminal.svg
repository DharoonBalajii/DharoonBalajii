<svg xmlns="http://www.w3.org/2000/svg" width="840" height="300" viewBox="0 0 840 300" role="img" aria-labelledby="t d">
<title id="t">Dharoon's terminal</title>
<desc id="d">An animated terminal. whoami: Dharoon Balajii, CSE at VIT Vellore, building AI products and the backends behind them. ls projects: gitpath, raksha-thunai, learnflow, safe-step, socrates-aid. cat gitpath README: any GitHub repo in, an interactive course out, with lessons, quizzes and an AI tutor. ./break-things --safely: rate limiting, Turnstile, encrypted secrets, GitHub OAuth, CI security scan.</desc>
<style>
  text { font-family: "JetBrains Mono", "SF Mono", "Fira Code", Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 14.5px; white-space: pre; }
  .show { animation: show .25s ease-out both; }
  .type { transform: translateX(var(--d)); animation-name: type; animation-fill-mode: both; }
  .caret { opacity: 0; animation-name: caret; animation-fill-mode: forwards; animation-timing-function: linear; }
  .blink { animation: show .01s both, blink 1.1s steps(1, end) infinite; }
  @keyframes show { from { opacity: 0; } to { opacity: 1; } }
  @keyframes type { from { transform: translateX(0); } to { transform: translateX(var(--d)); } }
  @keyframes caret { 0%, 99.9% { opacity: 1; } 100% { opacity: 0; } }
  @keyframes blink { 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) {
    .show, .type, .caret, .blink { animation: none !important; }
  }
</style>
