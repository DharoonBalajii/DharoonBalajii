<svg xmlns="http://www.w3.org/2000/svg" width="440" height="330" viewBox="0 0 440 330" role="img" aria-labelledby="t d">
<title id="t">Dharoon coding at night</title>
<desc id="d">An illustration of Dharoon seen from behind, wearing headphones at a desk late at night. Code types out on the monitor and a build-passed notification pops up. A mug of coffee steams, a rubber duck nods, and the moon shines through the window.</desc>
<defs>
  <linearGradient id="room" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b1745"/><stop offset="1" stop-color="#0f0c29"/></linearGradient>
  <radialGradient id="glow"><stop offset="0" stop-color="#9d8cff" stop-opacity=".5"/><stop offset=".5" stop-color="#c792ea" stop-opacity=".16"/><stop offset="1" stop-color="#c792ea" stop-opacity="0"/></radialGradient>
  <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#17143d"/><stop offset="1" stop-color="#0d0b24"/></linearGradient>
  <linearGradient id="hoodie" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a3480"/><stop offset="1" stop-color="#26225a"/></linearGradient>
  <clipPath id="card"><rect width="440" height="330" rx="16"/></clipPath>
</defs>
<style>
  .ln { transform-box: fill-box; transform-origin: left center; animation-duration: 9.0s; animation-iteration-count: infinite; animation-timing-function: ease-out; }
  .toast { animation: toast 9.0s ease-out infinite; }
  .glow { animation: glow 4s ease-in-out infinite alternate; }
  .star { animation: star 2.4s ease-in-out infinite alternate; }
  .bob { animation: bob .9s ease-in-out infinite alternate; }
  .steam { opacity: 0; animation: steam 3s ease-out infinite; }
  .duck { transform-box: fill-box; transform-origin: 50% 100%; animation: duck 5s ease-in-out infinite; }
  .plant { transform-box: fill-box; transform-origin: 50% 100%; animation: sway 4s ease-in-out infinite alternate; }
  @keyframes l0 { 0%, 3.33% { transform: scaleX(0); opacity: 1; } 8.33% { transform: scaleX(1); } 92% { transform: scaleX(1); opacity: 1; } 96%, 100% { transform: scaleX(1); opacity: 0; } }
  @keyframes l1 { 0%, 9.44% { transform: scaleX(0); opacity: 1; } 14.44% { transform: scaleX(1); } 92% { transform: scaleX(1); opacity: 1; } 96%, 100% { transform: scaleX(1); opacity: 0; } }
  @keyframes l2 { 0%, 15.56% { transform: scaleX(0); opacity: 1; } 20.56% { transform: scaleX(1); } 92% { transform: scaleX(1); opacity: 1; } 96%, 100% { transform: scaleX(1); opacity: 0; } }
  @keyframes l3 { 0%, 21.67% { transform: scaleX(0); opacity: 1; } 26.67% { transform: scaleX(1); } 92% { transform: scaleX(1); opacity: 1; } 96%, 100% { transform: scaleX(1); opacity: 0; } }
  @keyframes l4 { 0%, 27.78% { transform: scaleX(0); opacity: 1; } 32.78% { transform: scaleX(1); } 92% { transform: scaleX(1); opacity: 1; } 96%, 100% { transform: scaleX(1); opacity: 0; } }
  @keyframes l5 { 0%, 33.89% { transform: scaleX(0); opacity: 1; } 38.89% { transform: scaleX(1); } 92% { transform: scaleX(1); opacity: 1; } 96%, 100% { transform: scaleX(1); opacity: 0; } }
  @keyframes l6 { 0%, 40.00% { transform: scaleX(0); opacity: 1; } 45.00% { transform: scaleX(1); } 92% { transform: scaleX(1); opacity: 1; } 96%, 100% { transform: scaleX(1); opacity: 0; } }
  @keyframes l7 { 0%, 46.11% { transform: scaleX(0); opacity: 1; } 51.11% { transform: scaleX(1); } 92% { transform: scaleX(1); opacity: 1; } 96%, 100% { transform: scaleX(1); opacity: 0; } }
  @keyframes l8 { 0%, 52.22% { transform: scaleX(0); opacity: 1; } 57.22% { transform: scaleX(1); } 92% { transform: scaleX(1); opacity: 1; } 96%, 100% { transform: scaleX(1); opacity: 0; } }
  @keyframes l9 { 0%, 58.33% { transform: scaleX(0); opacity: 1; } 63.33% { transform: scaleX(1); } 92% { transform: scaleX(1); opacity: 1; } 96%, 100% { transform: scaleX(1); opacity: 0; } }
  @keyframes toast { 0%, 66% { opacity: 0; transform: translateY(6px); } 70%, 89% { opacity: 1; transform: translateY(0); } 93%, 100% { opacity: 0; transform: translateY(0); } }
  @keyframes glow { from { opacity: .7; } to { opacity: 1; } }
  @keyframes star { from { opacity: .25; } to { opacity: 1; } }
  @keyframes bob { from { transform: translateY(0); } to { transform: translateY(1.8px); } }
  @keyframes steam { 0% { opacity: 0; transform: translateY(4px); } 40% { opacity: .55; } 100% { opacity: 0; transform: translateY(-12px); } }
  @keyframes duck { 0%, 78%, 100% { transform: rotate(0); } 83% { transform: rotate(-9deg); } 89% { transform: rotate(6deg); } 94% { transform: rotate(-3deg); } }
  @keyframes sway { from { transform: rotate(-3deg); } to { transform: rotate(3deg); } }
  @media (prefers-reduced-motion: reduce) {
    .ln, .toast, .glow, .star, .bob, .duck, .plant { animation: none !important; }
    .steam { animation: none !important; opacity: .4; }
  }
</style>
<g clip-path="url(#card)">
  <rect width="440" height="330" fill="url(#room)"/>

  <!-- window with moon -->
  <g transform="translate(32 32)">
    <rect width="92" height="74" rx="4" fill="#141134" stroke="#302b63" stroke-width="3"/>
    <circle cx="66" cy="24" r="11" fill="#ffcb6b"/>
    <circle cx="72" cy="19" r="10" fill="#141134"/>
    <circle class="star" cx="18" cy="16" r="1.4" fill="#eeffff" style="animation-delay:0s"/><circle class="star" cx="36" cy="44" r="1.4" fill="#eeffff" style="animation-delay:0.8s"/><circle class="star" cx="14" cy="58" r="1.4" fill="#eeffff" style="animation-delay:1.6s"/><circle class="star" cx="52" cy="60" r="1.4" fill="#eeffff" style="animation-delay:0.4s"/><circle class="star" cx="80" cy="62" r="1.4" fill="#eeffff" style="animation-delay:1.2s"/><circle class="star" cx="30" cy="26" r="1.4" fill="#eeffff" style="animation-delay:2.0s"/>
    <path d="M46 0V74M0 37H92" stroke="#302b63" stroke-width="3"/>
  </g>

  <!-- shelf with books -->
  <g transform="translate(336 50)">
    <rect x="0" y="26" width="10" height="34" rx="1.5" fill="#c792ea"/>
    <rect x="12" y="32" width="8" height="28" rx="1.5" fill="#89ddff"/>
    <rect x="22" y="22" width="12" height="38" rx="1.5" fill="#82aaff"/>
    <rect x="36" y="30" width="9" height="30" rx="1.5" fill="#c3e88d"/>
    <rect x="50" y="28" width="9" height="32" rx="1.5" fill="#ffcb6b" transform="rotate(14 54.5 60)"/>
    <rect x="-8" y="60" width="104" height="5" rx="2" fill="#302b63"/>
  </g>

  <ellipse class="glow" cx="220" cy="132" rx="200" ry="150" fill="url(#glow)"/>

  <!-- desk -->
  <rect x="0" y="232" width="440" height="100" fill="#16133a"/>
  <rect x="0" y="227" width="440" height="8" fill="#2a2660"/>
  <rect x="0" y="227" width="440" height="2" fill="#3d3785"/>
  <ellipse cx="220" cy="231" rx="120" ry="4" fill="#c792ea" opacity=".1"/>

  <!-- monitor -->
  <rect x="211" y="196" width="18" height="30" fill="#24243e"/>
  <rect x="186" y="221" width="68" height="7" rx="3" fill="#2c2a52"/>
  <rect x="112" y="62" width="216" height="136" rx="8" fill="#0b0920" stroke="#3d3785" stroke-width="4"/>
  <rect x="118" y="68" width="204" height="124" rx="4" fill="url(#screen)"/>
  <circle cx="126" cy="76" r="2" fill="#f07178"/>
  <circle cx="133" cy="76" r="2" fill="#ffcb6b"/>
  <circle cx="140" cy="76" r="2" fill="#c3e88d"/>
  <rect x="150" y="74" width="34" height="4" rx="2" fill="#2a2756"/>
  <rect x="125" y="90" width="5" height="4.5" rx="2" fill="#3b3f63"/>
  <g class="ln" style="animation-name:l0"><rect x="136" y="90" width="22" height="4.5" rx="2.25" fill="#c792ea"/><rect x="163" y="90" width="40" height="4.5" rx="2.25" fill="#82aaff"/><rect x="208" y="90" width="12" height="4.5" rx="2.25" fill="#a6accd"/></g>
  <rect x="125" y="100" width="5" height="4.5" rx="2" fill="#3b3f63"/>
  <g class="ln" style="animation-name:l1"><rect x="146" y="100" width="18" height="4.5" rx="2.25" fill="#c792ea"/><rect x="169" y="100" width="30" height="4.5" rx="2.25" fill="#a6accd"/><rect x="204" y="100" width="10" height="4.5" rx="2.25" fill="#89ddff"/><rect x="219" y="100" width="36" height="4.5" rx="2.25" fill="#c3e88d"/></g>
  <rect x="125" y="110" width="5" height="4.5" rx="2" fill="#3b3f63"/>
  <g class="ln" style="animation-name:l2"><rect x="146" y="110" width="26" height="4.5" rx="2.25" fill="#82aaff"/><rect x="177" y="110" width="20" height="4.5" rx="2.25" fill="#a6accd"/><rect x="202" y="110" width="44" height="4.5" rx="2.25" fill="#ffcb6b"/></g>
  <rect x="125" y="120" width="5" height="4.5" rx="2" fill="#3b3f63"/>
  <g class="ln" style="animation-name:l3"><rect x="156" y="120" width="16" height="4.5" rx="2.25" fill="#c792ea"/><rect x="177" y="120" width="52" height="4.5" rx="2.25" fill="#a6accd"/></g>
  <rect x="125" y="130" width="5" height="4.5" rx="2" fill="#3b3f63"/>
  <g class="ln" style="animation-name:l4"><rect x="156" y="130" width="30" height="4.5" rx="2.25" fill="#89ddff"/><rect x="191" y="130" width="24" height="4.5" rx="2.25" fill="#c3e88d"/><rect x="220" y="130" width="20" height="4.5" rx="2.25" fill="#a6accd"/></g>
  <rect x="125" y="140" width="5" height="4.5" rx="2" fill="#3b3f63"/>
  <g class="ln" style="animation-name:l5"><rect x="146" y="140" width="8" height="4.5" rx="2.25" fill="#a6accd"/></g>
  <rect x="125" y="150" width="5" height="4.5" rx="2" fill="#3b3f63"/>
  <g class="ln" style="animation-name:l6"><rect x="146" y="150" width="20" height="4.5" rx="2.25" fill="#c792ea"/><rect x="171" y="150" width="28" height="4.5" rx="2.25" fill="#82aaff"/><rect x="204" y="150" width="30" height="4.5" rx="2.25" fill="#ffcb6b"/></g>
  <rect x="125" y="160" width="5" height="4.5" rx="2" fill="#3b3f63"/>
  <g class="ln" style="animation-name:l7"><rect x="156" y="160" width="34" height="4.5" rx="2.25" fill="#a6accd"/><rect x="195" y="160" width="18" height="4.5" rx="2.25" fill="#89ddff"/><rect x="218" y="160" width="40" height="4.5" rx="2.25" fill="#c3e88d"/></g>
  <rect x="125" y="170" width="5" height="4.5" rx="2" fill="#3b3f63"/>
  <g class="ln" style="animation-name:l8"><rect x="146" y="170" width="8" height="4.5" rx="2.25" fill="#a6accd"/></g>
  <rect x="125" y="180" width="5" height="4.5" rx="2" fill="#3b3f63"/>
  <g class="ln" style="animation-name:l9"><rect x="136" y="180" width="8" height="4.5" rx="2.25" fill="#a6accd"/></g>
  <g class="toast">
    <rect x="236" y="76" width="80" height="17" rx="8.5" fill="#c3e88d"/>
    <text x="276" y="87.8" text-anchor="middle" fill="#0f0c29" style="font: 600 9px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">✓ build passed</text>
  </g>

  <!-- coffee -->
  <path class="steam" d="M66 199q-4-5 0-10t0-10" stroke="#a6accd" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path class="steam" style="animation-delay:1s" d="M72 199q-4-5 0-10t0-10" stroke="#a6accd" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path class="steam" style="animation-delay:2s" d="M78 199q-4-5 0-10t0-10" stroke="#a6accd" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M82 210h4a6 6 0 0 1 0 12h-4" stroke="#89ddff" stroke-width="4" fill="none"/>
  <rect x="60" y="204" width="23" height="24" rx="4" fill="#89ddff"/>
  <ellipse cx="71.5" cy="205" rx="10.5" ry="2.6" fill="#4a3428"/>
  <rect x="64" y="212" width="15" height="3" rx="1.5" fill="#0f0c29" opacity=".25"/>

  <!-- rubber duck, the best debugger -->
  <g class="duck">
    <path d="M341 218q-4-9 4-8" fill="#f2b84f"/>
    <ellipse cx="356" cy="219" rx="15" ry="8.5" fill="#ffcb6b"/>
    <path d="M348 216q8 7 15 0" stroke="#e0a43d" stroke-width="2" fill="none" stroke-linecap="round"/>
    <circle cx="364" cy="206" r="7.5" fill="#ffcb6b"/>
    <path d="M370.5 205l7.5 2.2l-7.5 2.8z" fill="#f78c6c"/>
    <circle cx="366" cy="204" r="1.4" fill="#0f0c29"/>
  </g>

  <!-- plant -->
  <g class="plant">
    <path d="M409 211q-14-12-8-30q10 12 8 30z" fill="#9fd16e"/>
    <path d="M409 211q14-14 8-32q-10 14-8 32z" fill="#c3e88d"/>
    <path d="M409 211q-2-20 0-34q4 16 0 34z" fill="#b5dd84"/>
  </g>
  <path d="M396 210h26l-3 18h-20z" fill="#302b63"/>
  <rect x="394" y="208" width="30" height="4" rx="2" fill="#3d3785"/>

  <!-- Dharoon, from behind -->
  <path d="M148 330C148 246 170 212 220 210C270 212 292 246 292 330Z" fill="url(#hoodie)"/>
  <path d="M157 250C165 224 186 212 220 211C254 212 275 224 283 250" stroke="#c792ea" stroke-opacity=".5" stroke-width="2" fill="none"/>
  <ellipse cx="220" cy="204" rx="27" ry="11" fill="#433c8f"/>
  <path d="M197 208q23 20 46 0" stroke="#4d469c" stroke-width="3" fill="none" stroke-linecap="round"/>
  <g class="bob">
