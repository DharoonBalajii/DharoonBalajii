    <circle cx="220" cy="167" r="23" fill="#252047" stroke="#9d8cff" stroke-opacity=".55" stroke-width="2"/>
    <path d="M206 158q8-6 16-3M214 170q8-5 15-1M203 176q6-3 11 0" stroke="#352d66" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M203 151a23 23 0 0 1 34 0" stroke="#89ddff" stroke-opacity=".4" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M195 170a25.5 28 0 0 1 50 0" stroke="#c792ea" stroke-width="5" fill="none" stroke-linecap="round"/>
    <rect x="188" y="159" width="12" height="23" rx="5.5" fill="#c792ea"/>
    <rect x="240" y="159" width="12" height="23" rx="5.5" fill="#c792ea"/>
    <rect x="191" y="163" width="3" height="15" rx="1.5" fill="#a679c9"/>
    <rect x="246" y="163" width="3" height="15" rx="1.5" fill="#a679c9"/>
  </g>

  <!-- chair -->
  <rect x="166" y="250" width="108" height="110" rx="20" fill="#1c1a3d" stroke="#302b63" stroke-width="2"/>
  <rect x="179" y="262" width="82" height="90" rx="13" fill="none" stroke="#2a2756" stroke-width="2"/>
  <path d="M182 251.5h76" stroke="#c792ea" stroke-opacity=".35" stroke-width="2" stroke-linecap="round"/>
</g>
<rect x="0.5" y="0.5" width="439" height="329" rx="16" fill="none" stroke="#302b63"/>
</svg>
